name: Animation options

# Manual. Step 3 of the redesign: each way of making the mechanism
# animations, tried on the same story (the Hyatt Regency walkways), results
# kept as they come out, failures included. Nothing is uploaded to YouTube.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Which options to run: all, or a list like scratch,aivideo"
        default: "all"

permissions:
  contents: read

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}

jobs:
  writers:
    # the free writers write the whole animation / describe it in building blocks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [scratch, blocks, kit]
    if: inputs.only == 'all' || contains(inputs.only, 'scratch') || contains(inputs.only, 'blocks') || contains(inputs.only, 'kit')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt numpy
      - if: inputs.only == 'all' || contains(inputs.only, matrix.mode)
        run: python tools/option_demos.py ${{ matrix.mode }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-${{ matrix.mode }}
          path: out/
          retention-days: 14

  aivideo:
    if: inputs.only == 'all' || contains(inputs.only, 'aivideo')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt gradio_client
      - env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/option_demos.py aivideo out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-aivideo
          path: out/
          retention-days: 14

  manim:
    if: inputs.only == 'all' || contains(inputs.only, 'manim')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libpango1.0-dev libcairo2-dev pkg-config
      - run: pip install manim
      - run: manim -qm --format mp4 --media_dir media -o manim_demo tools/manim_demo.py HyattBeat
      - run: mkdir -p out && find media -name 'manim_demo.mp4' -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-manim
          path: out/
          retention-days: 14
