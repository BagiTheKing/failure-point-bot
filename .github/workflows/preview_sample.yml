name: Episode preview

# Manual. The signature preview (tools/preview.py): about ten seconds before
# the cold open, "The flaw. The forces. The failure. And the fix.", cut from
# a finished episode run, alone and set into the episode. The preview goes
# to preview-media (previews/<name>/); the episode with it is the run's
# artifact episode-<name>p, ready for Publish episode. Nothing is uploaded.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Episode sample run (its prep and episode artifacts)"
        required: true
      name:
        description: "The episode's name (artifact episode-<name>)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: ./.github/actions/ffmpeg
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files
      - name: Fetch Kokoro model files (cache miss only)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: episode-${{ inputs.name }}
          path: ep
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: The score's tracks
        run: python tools/fetch_music.py --score
      - name: Preview, and the episode with it
        env:
          KOKORO_VOICE: am_echo
        run: |
          python -u tools/preview.py prep ep out --splice
          cp ep/timed_sheet.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.name }}p
          path: |
            out/episode.mp4
            out/episode.json
            out/timed_sheet.json
          retention-days: 14
      - name: Push the preview to preview-media
        continue-on-error: true
        run: |
          mkdir -p pm && cd pm
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin preview-media && git checkout -q -B preview-media origin/preview-media || true
          mkdir -p previews/${{ inputs.name }}
          cp ../out/preview.mp4 ../out/preview.json ../out/episode.json previews/${{ inputs.name }}/
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Preview: ${{ inputs.name }} (run ${{ github.run_number }})"
          for i in 1 2 3; do git push -q origin preview-media && break; git pull -q --rebase origin preview-media; done
