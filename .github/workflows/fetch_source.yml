name: Fetch source

# Manual. Downloads one public source document (an investigation report, a
# fact sheet) on the runner, which can reach sites a review session cannot,
# and adds it and its text to preview-media under sources/<name>/. It only
# adds files: preview-media keeps everything else.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "The document's URL (PDF or web page)"
        required: true
      name:
        description: "Folder under sources/ on preview-media, e.g. teton"
        required: true
      file:
        description: "File name to save it as, e.g. panel_report.pdf"
        required: true
      start:
        description: "A video: keep only from this second (blank = the whole file)"
        default: ""
      seconds:
        description: "A video: and this many seconds (with start; saved as H.264 .mp4)"
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: System packages, retried (a runner's apt mirror sometimes hangs)
        run: |
          for i in 1 2 3; do
            timeout 600 sudo apt-get -o Acquire::http::Timeout=20 update -q && timeout 600 sudo apt-get -o Acquire::http::Timeout=20 install -y -q poppler-utils && break
            echo "apt try $i failed: next on the main Ubuntu mirror"; [ $i = 3 ] && exit 1
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt; sleep 5
          done
      - uses: actions/checkout@v4
        if: inputs.start != ''
      - uses: ./.github/actions/ffmpeg
        if: inputs.start != ''
      - name: Download, and its text
        env:
          URL: ${{ inputs.url }}
          FILE: ${{ inputs.file }}
        run: |
          mkdir -p out
          curl -sSL --fail --retry 3 -A "Mozilla/5.0 (research; failure-point-bot)" -o "out/$FILE" "$URL"
          if [ -n "${{ inputs.start }}" ]; then
            # a piece of a long video, small enough for git (GitHub refuses files over 100 MB)
            ffmpeg -v error -y -ss "${{ inputs.start }}" -i "out/$FILE" -t "${{ inputs.seconds }}" \
              -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -c:a aac -b:a 128k "out/${FILE%.*}.mp4"
            [ "$FILE" = "${FILE%.*}.mp4" ] || rm "out/$FILE"
          fi
          ls -la out
          case "$FILE" in
            *.pdf) pdftotext -layout "out/$FILE" "out/${FILE%.pdf}.txt"; pdftotext "out/$FILE" "out/${FILE%.pdf}.flow.txt"
                   wc -w "out/${FILE%.pdf}.txt" ;;
          esac
      - name: Add to preview-media
        env:
          NAME: ${{ inputs.name }}
        run: |
          mkdir -p pm && cd pm
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin preview-media && git checkout -q -B preview-media origin/preview-media
          mkdir -p "sources/$NAME"
          cp ../out/* "sources/$NAME/"
          git add -A
          git diff --cached --quiet && { echo "already there"; exit 0; }
          git commit -q -m "Source: $NAME/${{ inputs.file }}"
          for i in 1 2 3; do git push -q origin preview-media && break; git pull -q --rebase origin preview-media; done
