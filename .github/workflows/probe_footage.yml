name: Probe archival footage

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Queries, separated by |"
        default: "Six-Day War|Gamal Abdel Nasser|Israel 1967|Egypt 1967 army|Straits of Tiran"
      era:
        default: "1967"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages, retried (a runner's apt mirror sometimes hangs)
        run: |
          for i in 1 2 3; do
            timeout 600 sudo apt-get -o Acquire::http::Timeout=20 update -q && timeout 600 sudo apt-get -o Acquire::http::Timeout=20 install -y -q ffmpeg && break
            echo "apt try $i failed: next on the main Ubuntu mirror"; [ $i = 3 ] && exit 1
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt; sleep 5
          done
      - run: pip install requests pillow
      - name: Probe
        env:
          PROBE_ERA: ${{ inputs.era }}
          QUERIES: ${{ inputs.queries }}
        run: |
          IFS='|' read -ra Q <<< "$QUERIES"
          python tools/probe_footage.py "${Q[@]}"
