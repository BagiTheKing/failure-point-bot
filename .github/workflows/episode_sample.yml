name: Episode sample

# Manual. One full 8-10 minute episode from an animation sheet (steps 5b/5c):
# every shot voiced in am_echo, the kits and the 3D camera timed to the
# voice, real photos for the archive shots, the 3D model rendered across
# many runners, its own 3D fall as the collapse (no AI video: owner, 2026-11-05), all cut
# together by src/episode.py. Results go to preview-media (episodes/<name>/)
# and the run's artifacts; nothing is uploaded to YouTube.
on:
  workflow_dispatch:
    inputs:
      sheet:
        description: "Sheet: a repo path, or preview-media:<path> (e.g. preview-media:sheets/i35w/sheet.json)"
        default: "preview-media:sheets/i35w/sheet.json"
      name:
        description: "Name under episodes/ on preview-media"
        default: "i35w"
      samples:
        description: "3D render samples per pixel"
        default: "16"
      reuse_run:
        description: "Re-cut: reuse this earlier run's voice and 3D frames (blank = make everything; voice and frames keep 14 days)"
        default: ""
      hook:
        description: "Cold-open lines, split by | (blank = the sheet's own, or written by the AI)"
        default: ""
      title:
        description: "Episode title for the cold open (blank = the sheet's / the AI's)"
        default: ""
      keep:
        description: "Re-cut keeping the earlier run's cold open and pictures (only assemble again)"
        type: boolean
        default: false
      revoice:
        description: "Re-cut: voice again the lines the repo's sheet has changed (the 3D keeps its timing)"
        type: boolean
        default: false
      frames_run:
        description: "Run whose 3D frames to use (blank = the re-cut run's)"
        default: ""
      rerender:
        description: "Re-cut: render these 3D frames again, FIRST-LAST, over the reused ones (blank = none)"
        default: ""
      report:
        description: "The investigation report's PDF, for its pictures (public domain; blank = none)"
        default: ""
      report_credit:
        description: "Its credit line (agency, report, year)"
        default: ""

permissions:
  contents: write
  actions: read


jobs:
  prepare:
    if: inputs.reuse_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      per: ${{ steps.plan.outputs.per }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: System packages, retried (a runner's apt mirror sometimes hangs)
        run: |
          for i in 1 2 3; do
            timeout 600 sudo apt-get -o Acquire::http::Timeout=20 update -q && timeout 600 sudo apt-get -o Acquire::http::Timeout=20 install -y -q ffmpeg espeak-ng poppler-utils tesseract-ocr && break
            echo "apt try $i failed: next on the main Ubuntu mirror"; [ $i = 3 ] && exit 1
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt; sleep 5
          done
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files
      - name: Fetch Kokoro model files (cache miss only)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
      - run: pip install -r requirements.txt
      - name: Fetch the sheet
        env:
          SHEET: ${{ inputs.sheet }}
        run: |
          mkdir -p prep
          case "$SHEET" in
            preview-media:*)
              git fetch -q origin preview-media
              git show "origin/preview-media:${SHEET#preview-media:}" > prep/sheet.json ;;
            *) cp "$SHEET" prep/sheet.json ;;
          esac
      - name: Voice, timing, cold open, photos
        env:
          KOKORO_VOICE: am_echo
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPORT: ${{ inputs.report }}
          REPORT_CREDIT: ${{ inputs.report_credit }}
        run: |
          python tools/episode_sample.py prepare prep/sheet.json prep --name "${{ inputs.name }}" \
            --report "$REPORT" --report-credit "$REPORT_CREDIT" ${{ inputs.keep && '--keep' || '' }}
      - id: plan
        run: |
          echo "shards=$(python -c 'import json;print(json.dumps(json.load(open("prep/shards.json"))["shards"]))')" >> "$GITHUB_OUTPUT"
          echo "per=$(python -c 'import json;print(json.load(open("prep/shards.json"))["per"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: prep/
          retention-days: 90

  recut:
    if: inputs.reuse_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: System packages, retried (a runner's apt mirror sometimes hangs)
        run: |
          for i in 1 2 3; do
            timeout 600 sudo apt-get -o Acquire::http::Timeout=20 update -q && timeout 600 sudo apt-get -o Acquire::http::Timeout=20 install -y -q ffmpeg espeak-ng poppler-utils tesseract-ocr && break
            echo "apt try $i failed: next on the main Ubuntu mirror"; [ $i = 3 ] && exit 1
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt; sleep 5
          done
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files
      - name: Fetch Kokoro model files (cache miss only)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Cold open and pictures again (voice, timing and 3D kept)
        env:
          KOKORO_VOICE: am_echo
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HOOK: ${{ inputs.hook }}
          TITLE: ${{ inputs.title }}
          REPORT: ${{ inputs.report }}
          REPORT_CREDIT: ${{ inputs.report_credit }}
        run: |
          python tools/episode_sample.py recut prep --hook "$HOOK" --title "$TITLE" --name "${{ inputs.name }}" \
            --report "$REPORT" --report-credit "$REPORT_CREDIT" ${{ inputs.keep && '--keep' || '' }} \
            ${{ inputs.revoice && '--revoice' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: prep/
          retention-days: 90

  render3d:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install bpy pillow
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
      - name: Render this shard's frames
        working-directory: src
        run: |
          PER=${{ needs.prepare.outputs.per }}
          FIRST=$(( ${{ matrix.shard }} * PER + 1 ))
          LAST=$(( FIRST + PER - 1 ))
          python -m kits.render3d ../prep/timed_sheet.json ../raw \
            --first $FIRST --last $LAST --samples ${{ inputs.samples }}
      - name: Ship as JPEG (a tenth of the size)
        run: |
          python - <<'PY'
          import glob, os
          from PIL import Image
          for p in glob.glob("raw/*.png"):
              Image.open(p).convert("RGB").save(p[:-4] + ".jpg", quality=94)
              os.remove(p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frames3d-${{ matrix.shard }}
          path: raw/
          retention-days: 90

  # a re-cut that fixes one 3D shot: those frames only, in five parts, laid
  # over the reused run's frames at assembly (Silver Bridge, 2026-11-05: a
  # camera that skimmed the cars' roofs, 190 frames of 4,000)
  patch3d:
    if: inputs.reuse_run != '' && inputs.rerender != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install bpy pillow
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Render this part of the frames
        working-directory: src
        env:
          RANGE: ${{ inputs.rerender }}
        run: |
          A=${RANGE%-*}; B=${RANGE#*-}
          PER=$(( (B - A + 5) / 5 ))
          FIRST=$(( A + ${{ matrix.part }} * PER )); LAST=$(( FIRST + PER - 1 ))
          [ $LAST -gt $B ] && LAST=$B
          mkdir -p ../raw
          if [ $FIRST -le $B ]; then
            python -m kits.render3d ../prep/timed_sheet.json ../raw --first $FIRST --last $LAST --samples ${{ inputs.samples }}
          fi
      - name: Ship as JPEG
        run: |
          python - <<'PY'
          import glob, os
          from PIL import Image
          for p in glob.glob("raw/*.png"):
              Image.open(p).convert("RGB").save(p[:-4] + ".jpg", quality=94)
              os.remove(p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: patch3d-${{ matrix.part }}
          path: raw/
          retention-days: 90
          if-no-files-found: ignore

  assemble:
    needs: [prepare, render3d, recut, patch3d]
    if: always() && (needs.render3d.result == 'success' || needs.recut.result == 'success') && needs.patch3d.result != 'failure' && needs.patch3d.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: ./.github/actions/ffmpeg
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files
      - name: Fetch Kokoro model files (cache miss only)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
      - uses: actions/download-artifact@v4
        with:
          pattern: frames3d-*
          path: raw
          merge-multiple: true
          run-id: ${{ inputs.frames_run || inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: The 3D frames rendered again, over the reused ones
        if: inputs.rerender != ''
        uses: actions/download-artifact@v4
        with:
          pattern: patch3d-*
          path: raw_patch
          merge-multiple: true
      - name: Lay them over (their label anchors read last, so they win)
        if: inputs.rerender != ''
        run: |
          for f in raw_patch/anchors_*.json; do [ -e "$f" ] && mv "$f" "raw/anchors_zpatch_$(basename "$f" .json | cut -d_ -f2).json"; done
          n=$(ls raw_patch | wc -l); cp -f raw_patch/* raw/ 2>/dev/null || true
          echo "$n frames rendered again"
      - name: The score's tracks (Kevin MacLeod, CC BY, with their credits)
        run: python tools/fetch_music.py --score
      - name: Assemble the episode
        run: |
          python tools/episode_sample.py assemble prep raw
          python tools/thumbnails.py prep raw prep/thumbs || echo "no thumbnails"
      - name: The signature preview, before the cold open
        env:
          KOKORO_VOICE: am_echo
        run: |
          # "The flaw. The forces. The failure. And the fix." (tools/preview.py)
          mkdir -p prep/_ep && cp prep/episode.mp4 prep/episode.json prep/_ep/
          if python -u tools/preview.py prep prep/_ep prep/_pv --splice; then
            cp prep/_pv/episode.mp4 prep/_pv/episode.json prep/
          else
            echo "no preview: the episode goes out without it"
          fi
          rm -rf prep/_ep prep/_pv
      - uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.name }}
          path: |
            prep/episode.mp4
            prep/episode.json
            prep/timed_sheet.json
          retention-days: 90
      - name: Push to preview-media
        run: |
          mkdir -p pm && cd pm
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin preview-media && git checkout -q -B preview-media origin/preview-media || true
          mkdir -p episodes/${{ inputs.name }}
          cp ../prep/episode.json ../prep/timed_sheet.json episodes/${{ inputs.name }}/
          cp ../prep/thumbs/*.jpg episodes/${{ inputs.name }}/ 2>/dev/null || true
          # GitHub refuses files over 100 MB: a smaller copy for review if needed
          # (the full-quality file is the run's artifact)
          SIZE=$(stat -c %s ../prep/episode.mp4)
          if [ "$SIZE" -gt 95000000 ]; then
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 ../prep/episode.mp4)
            KBPS=$(python3 -c "print(int(88e6 * 8 / float('$DUR') / 1000) - 160)")
            ffmpeg -v error -y -i ../prep/episode.mp4 -c:v libx264 -b:v ${KBPS}k -maxrate ${KBPS}k \
              -bufsize $((KBPS * 2))k -c:a aac -b:a 128k episodes/${{ inputs.name }}/episode.mp4
          else
            cp ../prep/episode.mp4 episodes/${{ inputs.name }}/
          fi
          git add -A
          git commit -q -m "Episode sample: ${{ inputs.name }} (run ${{ github.run_number }})"
          git push -q origin preview-media
