name: Sheet writer test

# Manual. Step 5a: the free writers fill an animation sheet from the story's
# verified fact sheet, and the 2D kit reel is rendered from it. Nothing is
# uploaded to YouTube; the sheet and the reel are pushed to preview-media.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Write only this story (hyatt, i35w, aloha or columbia; blank = hyatt and i35w)"
        default: ""

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1           # one at a time: the writers' free quotas are shared
      matrix:
        name: ${{ fromJSON(inputs.only && format('["{0}"]', inputs.only) || '["hyatt","i35w"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: System packages, retried (a runner's apt mirror sometimes hangs)
        run: |
          for i in 1 2 3; do
            timeout 300 sudo apt-get update -q && timeout 300 sudo apt-get install -y -q ffmpeg && break
            echo "apt try $i failed"; [ $i = 3 ] && exit 1; sleep 10
          done
      - run: pip install -r requirements.txt
      - name: Write the sheet and render the 2D kit from it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
        run: |
          case "${{ matrix.name }}" in
            hyatt) python tools/write_sheet.py "Hyatt Regency walkway collapse" hanging_walkways out/hyatt ;;
            i35w) python tools/write_sheet.py "I-35W Mississippi River bridge collapse" truss_bridge out/i35w ;;
            aloha) python tools/write_sheet.py "Aloha Airlines Flight 243" fuselage out/aloha ;;
            columbia) python tools/write_sheet.py "Space Shuttle Columbia disaster" orbiter out/columbia \
                        docs/sources/columbia_caib.txt ;;
            *) echo "unknown story ${{ matrix.name }}"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheet-${{ matrix.name }}
          path: |
            out/${{ matrix.name }}/sheet.json
            out/${{ matrix.name }}/facts.json
            out/${{ matrix.name }}/kit_from_written_sheet.mp4
          retention-days: 14
      - name: Push to preview-media
        if: success()
        run: |
          git fetch -q origin preview-media || true
          mkdir -p pm && cd pm
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin preview-media && git checkout -q -B preview-media origin/preview-media || true
          mkdir -p sheets/${{ matrix.name }}
          cp ../out/${{ matrix.name }}/sheet.json ../out/${{ matrix.name }}/facts.json \
             ../out/${{ matrix.name }}/kit_from_written_sheet.mp4 sheets/${{ matrix.name }}/
          git add -A
          git commit -q -m "Written sheet: ${{ matrix.name }} (run ${{ github.run_number }})"
          git push -q origin preview-media
